apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app: chat-pdf
type: Opaque
data:
  # IMPORTANT: The values below are placeholders.
  # You MUST replace them with your actual secrets, base64 encoded.
  # To generate a base64 encoded string, use: echo -n 'your_actual_value' | base64
  # Example for OPENAI_API_KEY: echo -n 'sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxx' | base64
  #
  # These keys are referenced in the deployment YAML files.

  # For OpenAI API Key
  OPENAI_API_KEY_PLACEHOLDER: "eW91ci1vcGVuYWktYXBpLWtleQ==" # Example: echo -n 'your-openai-api-key' | base64

  # For Flask SECRET_KEY (a long, random string)
  SECRET_KEY_PLACEHOLDER: "eW91cl9mbGFza19zZWNyZXRfa2V5X3BsYWlu" # Example: echo -n 'your_flask_secret_key_plain' | base64
  
  # If you are using externally managed PostgreSQL and its credentials are not part of DATABASE_URL in ConfigMap:
  # POSTGRES_USER_PLACEHOLDER: "ZGJfYWRtaW4=" # Example: echo -n 'db_admin' | base64
  # POSTGRES_PASSWORD_PLACEHOLDER: "cGFzc3dvcmQxMjM=" # Example: echo -n 'password123' | base64

  # Note:
  # If your DATABASE_URL in the ConfigMap already contains the username and password,
  # then POSTGRES_USER_PLACEHOLDER and POSTGRES_PASSWORD_PLACEHOLDER might not be needed here
  # unless other parts of your application or setup scripts expect them separately.
  # The current backend/worker deployments primarily rely on DATABASE_URL.
  # The placeholders for POSTGRES_USER/PASSWORD are commented out in the deployments for now.
  # If you choose to use them, ensure they are also added to the env section of the deployments.

# How to apply this secret:
# 1. Replace the placeholder base64 strings above with your actual base64 encoded secrets.
# 2. Save the file.
# 3. Run: kubectl apply -f kubernetes/secret.yaml
#
# Alternative - Create secret directly using kubectl:
# kubectl create secret generic app-secrets \
#   --from-literal=OPENAI_API_KEY_PLACEHOLDER='your_actual_openai_key' \
#   --from-literal=SECRET_KEY_PLACEHOLDER='your_actual_flask_secret_key'
#
# Remember to use the actual key names expected by your deployment YAMLs
# e.g., if deployment expects OPENAI_API_KEY, use that, not OPENAI_API_KEY_PLACEHOLDER in kubectl create.
# The placeholder key names in this file are just for illustration if you directly edit this YAML.
# It's often better to use distinct key names in the Secret (e.g. OPENAI_API_KEY) and then map them
# in the deployment's env section using `key: OPENAI_API_KEY`.
#
# For consistency with the ConfigMap and current Deployments, the keys in the `data` section
# of this Secret object should match the `key` specified in the `secretKeyRef` of the Deployment YAMLs.
# E.g., if Deployment has `secretKeyRef.key: OPENAI_API_KEY_PLACEHOLDER`, then this Secret must have
# `OPENAI_API_KEY_PLACEHOLDER` as a key in its `data` section.
#
# Let's assume the deployment files will use these _PLACEHOLDER suffixed keys for clarity during setup.
# User will replace the base64 values.
#
# The backend and worker deployments are currently set up to look for keys like:
# - OPENAI_API_KEY_PLACEHOLDER
# - SECRET_KEY_PLACEHOLDER
# (Potentially POSTGRES_USER_PLACEHOLDER and POSTGRES_PASSWORD_PLACEHOLDER if enabled)
# So, the keys in this file should match those.
# The user needs to provide the base64 encoded values for these keys.
